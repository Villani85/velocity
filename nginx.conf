server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # LA COMPRESSIONE NON E' UN DETTAGLIO QUI. Il pezzo grosso del sito e'
  # `assets/avvio-*.js`: 1,44 MB in chiaro e 463 kB compresso. Senza questa
  # riga si spedisce tre volte il necessario proprio sul file che blocca il
  # primo fotogramma — e' la stessa misura per cui esiste il preannuncio.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types
    text/plain text/css text/xml
    application/javascript application/json application/xml
    image/svg+xml;

  # E LE IMMAGINI E I MODELLI NON SI COMPRIMONO. `.webp` e `.glb` sono gia'
  # compressi dentro: rifarlo costa processore e non toglie un byte.

  # I file con l'impronta nel nome non cambiano mai: si possono tenere per
  # sempre. Vale per `assets/`, che Vite nomina con l'hash del contenuto.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # I modelli, le texture e il panorama NON hanno l'impronta nel nome, quindi
  # non possono essere immutabili: un giorno `auto2.glb` cambia e chi ce l'ha
  # in cache vedrebbe la vecchia. Un giorno di cache e' il compromesso.
  location ~* \.(glb|webp|avif|woff2)$ {
    add_header Cache-Control "public, max-age=86400";
  }

  # IL DOCUMENTO NO. `index.html` porta dentro i nomi con l'impronta: se resta
  # in cache, il browser continua a chiedere i pezzi della versione vecchia
  # anche dopo una pubblicazione nuova.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Il sito e' una pagina sola: qualunque indirizzo non trovato torna a lei,
  # se no un ricaricamento su un percorso profondo darebbe 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
